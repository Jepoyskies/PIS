{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PIS - Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --xu-blue-dark: #22356d; 
            --xu-gold: #b99430;
        }
        body { background-color: #f4f6f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .navbar-xu { background: var(--xu-blue-dark); padding: 10px 25px; border-bottom: 4px solid var(--xu-gold); }
        .sidebar-wrapper { background-color: var(--xu-blue-dark); color: white; min-width: 240px; }
        .list-group-item { background: transparent; color: rgba(255,255,255,0.7); border: none; padding: 15px 20px; transition: 0.2s; }
        .list-group-item:hover { color: var(--xu-gold); background: rgba(255,255,255,0.05); }
        .list-group-item.active { background: var(--xu-gold) !important; color: var(--xu-blue-dark) !important; font-weight: bold; border-radius: 0 30px 30px 0; margin-right: 15px; }
        .nav-link.active { color: var(--xu-blue-dark) !important; border-bottom: 3px solid var(--xu-gold) !important; }
    </style>
</head>
<body class="d-flex flex-column">
    <header class="navbar-xu d-flex justify-content-between align-items-center text-white">
        <div class="d-flex align-items-center gap-3">
            <img src="{% static 'images/xu-logo-stacked.png' %}" alt="Logo" style="width: 40px;" class="bg-white rounded p-1">
            <div class="fw-bold">XU PIS | <span class="small opacity-75">Maintenance</span></div>
        </div>
        <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm rounded-pill px-4">Log Off</a>
    </header>

    <div class="container-fluid flex-grow-1 p-0 overflow-hidden d-flex">
        <div class="sidebar-wrapper shadow">
            <div class="p-3 small opacity-50 text-uppercase fw-bold">Menu</div>
            <div class="list-group">
                <a href="{% url 'maintenance_dashboard' %}" class="list-group-item {% if 'dashboard' in request.path %}active{% endif %}">Overview</a>
                <a href="{% url 'manage_staff' %}" class="list-group-item {% if 'staff' in request.path %}active{% endif %}">Manage Staff</a>
                <a href="{% url 'manage_sections' %}" class="list-group-item">Sections</a>
            </div>
        </div>

        <div class="flex-grow-1 p-4 overflow-auto">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    {% block maintenance_content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
