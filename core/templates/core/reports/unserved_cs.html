{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unserved CS</title>
    <link href="{% static 'core/css/bootstrap.min.css' %}" rel="stylesheet">
    <style> body { background: #f8f9fa; padding: 20px; } @media print { .no-print { display: none; } } </style>
</head>
<body>
    <div class="container bg-white p-4 shadow-sm">
        <div class="no-print mb-3"><a href="{% url 'reports_dashboard' %}" class="btn btn-secondary btn-sm">&larr; Back</a> <button onclick="window.print()" class="btn btn-primary btn-sm">Print</button></div>
        <h4 class="text-center fw-bold">List of Unserved Community Service</h4>
        <table class="table table-bordered table-striped mt-4">
            <thead><tr><th>Student</th><th>Hours</th><th>Assigned Date</th></tr></thead>
            <tbody>
                {% for r in records %}
                <tr><td>{{ r.student.last_name }}, {{ r.student.first_name }}</td><td>{{ r.hours }}</td><td>{{ r.date_assigned }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
