version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: xjhs_pis_db
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - xjhs_mysql_data:/var/lib/mysql

  web:
    build: .
    # THE MAGIC FIX: Using runserver guarantees Admin CSS loads and Auto-Refresh works!
    command: python manage.py runserver 0.0.0.0:8000
    restart: on-failure
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=my-local-secret-key
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=xjhs_pis_db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_started

volumes:
  xjhs_mysql_data:
  static_volume: